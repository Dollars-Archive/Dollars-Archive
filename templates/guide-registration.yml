name: Keep walkthrough registration link

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: walkthrough-registration-link
  cancel-in-progress: false

jobs:
  link:
    if: github.repository_owner == 'Dollars-Archive' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure registration instructions are linked
        run: python .github/scripts/ensure_guide_registration.py
      - name: Commit only a missing registration link
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: connect walkthrough registration instructions'
          git push origin HEAD

